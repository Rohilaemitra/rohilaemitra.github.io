<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#f5f5f5;
font-family:Arial,sans-serif;
}

header{
background:#1565c0;
color:#fff;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
width:95%;
max-width:1200px;
margin:30px auto;
}

.card{
background:#fff;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

table{
width:100%;
border-collapse:collapse;
}

table th,
table td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

table th{
background:#1565c0;
color:#fff;
}

button{
padding:10px 20px;
background:red;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>

</head>

<body>

<header>

<h2>ROHILA E-MITRA ADMIN PANEL</h2>

<button onclick="logout()">
Logout
</button>

</header>

<div class="container">

<div class="card">

<h3>Contact Messages</h3>

<table>

<thead>

<tr>

<th>Name</th>

<th>Mobile</th>

<th>Email</th>

<th>Message</th>

</tr>

</thead>

<tbody id="data">

</tbody>

</table>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
