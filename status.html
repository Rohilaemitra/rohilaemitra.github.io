<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Status</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">Application Status</a><nav class="nav"><a href="index.html">Home</a><a href="admin.html">Admin</a></nav></div></header><main class="container"><div id="statusMsg" class="status"></div><section class="panel"><h2>स्थिति खोजें</h2><div class="toolbar"><input id="lookup" placeholder="Application ID या Mobile"><button class="btn" id="searchBtn">Search</button></div><div id="result"></div></section><section id="adminPanel" class="panel hidden"><h2>Admin: Add / Update Status</h2><form id="statusForm" class="form-grid"><div class="field"><label>Application ID</label><input id="applicationId" required></div><div class="field"><label>Customer Name</label><input id="customerName" required></div><div class="field"><label>Mobile</label><input id="mobile"></div><div class="field"><label>Service</label><input id="service" required></div><div class="field"><label>Status</label><select id="applicationStatus"><option>Received</option><option>In Process</option><option>Completed</option><option>Rejected</option></select></div><div class="field span-2"><label>Message</label><input id="message"></div><div class="span-4"><button class="btn" type="submit">Save Status</button></div></form></section></main><script type="module" src="status.js"></script></body></html>
