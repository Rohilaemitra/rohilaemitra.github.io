<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Secret Gallery Lock | ROHILA E-MITRA</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:grid;place-items:center;padding:18px}
    .box{width:min(420px,100%);background:#111827;border:1px solid #334155;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:26px}
    p{color:#cbd5e1;line-height:1.5}
    input{width:100%;padding:13px 14px;border:1px solid #475569;border-radius:10px;background:#0b1220;color:#fff;font-size:16px;outline:none}
    button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
    .back{display:block;text-align:center;color:#cbd5e1;margin-top:15px;text-decoration:none}
    #msg{min-height:22px;color:#fca5a5;font-weight:700;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h1>🔒 Secret Gallery</h1>
    <p>यह page केवल Admin login के बाद खुलता है। Gallery खोलने के लिए अलग password डालें।</p>
    <input id="secretPassword" type="password" placeholder="Secret Gallery Password" autocomplete="off">
    <button id="openBtn">Gallery खोलें</button>
    <div id="msg"></div>
    <a class="back" href="../admin.html">← Admin Panel</a>
  </div>

  <script type="module">
    import { auth } from "../firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const EXPECTED_HASH = "4592eb7614c5e93483530546ee6f72fec11ecf8e2ecccc184019fa46ddb32ee2";
    const input = document.getElementById("secretPassword");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("openBtn");

    let adminReady = false;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("../login.html");
        return;
      }
      adminReady = true;
    });

    async function sha256(text) {
      const bytes = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    async function unlock() {
      if (!adminReady) return;
      msg.textContent = "";
      const value = input.value;
      const hash = await sha256(value);

      if (hash !== EXPECTED_HASH) {
        msg.textContent = "गलत password.";
        input.select();
        return;
      }

      sessionStorage.setItem("secretAccess", "yes");
      sessionStorage.setItem("secretAccessAt", String(Date.now()));
      window.location.href = "gallery.html";
    }

    btn.addEventListener("click", unlock);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlock();
    });
  </script>
</body>
</html>
