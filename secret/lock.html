<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 Secret Gallery Lock</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#111;
}

.box{
background:#222;
padding:30px;
border-radius:15px;
text-align:center;
width:350px;
box-shadow:0 0 20px rgba(255,255,255,.2);
}

h2{
color:#fff;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
font-size:18px;
border:none;
border-radius:8px;
margin-bottom:15px;
outline:none;
}

button{
width:100%;
padding:12px;
font-size:18px;
border:none;
border-radius:8px;
background:#ff4081;
color:#fff;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#e91e63;
}

.error{
color:red;
margin-top:10px;
}
</style>

</head>

<body>

<div class="box">

<h2>🔒 Secret Gallery</h2>

<input
type="password"
id="pass"
placeholder="Enter Password">

<button onclick="login()">
Open Gallery
</button>

<p id="msg" class="error"></p>

</div>

<script>

const PASSWORD="12345"; // अपना Password यहाँ बदलें

function login(){

let p=document.getElementById("pass").value;

if(p===PASSWORD){

sessionStorage.setItem("secretAccess","yes");

location.replace("gallery.html");

}else{

document.getElementById("msg").innerHTML="❌ Wrong Password";

}

}

document.getElementById("pass").addEventListener("keypress",function(e){

if(e.key==="Enter"){
login();
}

});

</script>

</body>
</html>
