<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Secret Gallery | ROHILA E-MITRA</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
    header{position:sticky;top:0;z-index:5;background:#111827;border-bottom:1px solid #334155}
    .wrap{width:min(1100px,calc(100% - 24px));margin:auto}
    .head{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{font-size:24px;margin:0}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{display:inline-block;padding:9px 13px;border-radius:9px;text-decoration:none;color:#fff;font-weight:800;border:0;cursor:pointer}
    .back{background:#334155}.lock{background:#b91c1c}
    main{padding:24px 0 45px}
    #status{padding:20px;text-align:center;color:#cbd5e1}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .card{background:#111827;border:1px solid #334155;border-radius:14px;overflow:hidden}
    .card img,.card video{width:100%;height:230px;object-fit:cover;display:block;background:#020617}
    .name{padding:9px 11px;color:#cbd5e1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.card img,.card video{height:280px}}
  </style>
</head>
<body>
<header>
  <div class="wrap head">
    <h1>🔒 Secret Gallery</h1>
    <div class="actions">
      <a class="btn back" href="../admin.html">Admin Panel</a>
      <button class="btn lock" id="lockBtn">Lock Now</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="status">Gallery loading...</div>
  <div id="gallery" class="grid"></div>
</main>

<script type="module">
  import { auth, db } from "../firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const MAX_SESSION_MS = 10 * 60 * 1000;
  const access = sessionStorage.getItem("secretAccess");
  const accessAt = Number(sessionStorage.getItem("secretAccessAt") || 0);

  if (access !== "yes" || !accessAt || (Date.now() - accessAt) > MAX_SESSION_MS) {
    sessionStorage.removeItem("secretAccess");
    sessionStorage.removeItem("secretAccessAt");
    window.location.replace("lock.html");
  }

  document.getElementById("lockBtn").addEventListener("click", () => {
    sessionStorage.removeItem("secretAccess");
    sessionStorage.removeItem("secretAccessAt");
    window.location.replace("lock.html");
  });

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.replace("../login.html");
      return;
    }
    loadGallery(user.uid);
  });

  async function loadGallery(uid) {
    const status = document.getElementById("status");
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    try {
      let snap;
      try {
        snap = await getDocs(query(collection(db, "secretGallery"), orderBy("createdAt", "desc")));
      } catch (_) {
        snap = await getDocs(collection(db, "secretGallery"));
      }

      const items = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(item => item.url && (!item.ownerUid || item.ownerUid === uid));

      if (!items.length) {
        status.style.display = "block";
        status.textContent = "अभी कोई private photo नहीं है।";
        return;
      }

      status.style.display = "none";
      for (const item of items) {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.title || "Private photo";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = item.title || "Private Photo";

        card.appendChild(img);
        card.appendChild(name);
        gallery.appendChild(card);
      }
    } catch (err) {
      status.style.display = "block";
      status.textContent = "Gallery load नहीं हुई: " + (err.message || err);
      console.error(err);
    }
  }
</script>
</body>
</html>
