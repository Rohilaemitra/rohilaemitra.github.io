<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Secret Gallery | ROHILA E-MITRA</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
    header{position:sticky;top:0;z-index:5;background:#111827;border-bottom:1px solid #334155}
    .wrap{width:min(1100px,calc(100% - 24px));margin:auto}
    .head{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{font-size:24px;margin:0}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{display:inline-block;padding:9px 13px;border-radius:9px;text-decoration:none;color:#fff;font-weight:800;border:0;cursor:pointer}
    .back{background:#334155}.lock{background:#b91c1c}
    main{padding:24px 0 45px}
    #status{padding:20px;text-align:center;color:#cbd5e1}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .card{background:#111827;border:1px solid #334155;border-radius:14px;overflow:hidden}
    .card img,.card video{width:100%;height:230px;object-fit:cover;display:block;background:#020617}
    .name{padding:9px 11px;color:#cbd5e1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.card img,.card video{height:280px}}
  </style>
</head>
<body>
<header>
  <div class="wrap head">
    <h1>🔒 Secret Gallery</h1>
    <div class="actions">
      <a class="btn back" href="../index.html">Home</a>
      <button class="btn lock" id="lockBtn">Lock Now</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="status">Gallery loading...</div>
  <div id="gallery" class="grid"></div>
</main>

<script type="module">
  import { db } from "../firebase.js";
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const GRANT_MAX_MS = 15 * 1000;
  const grant = sessionStorage.getItem("secretGalleryGrant");
  const grantAt = Number(sessionStorage.getItem("secretGalleryGrantAt") || 0);

  if (!grant || !grantAt || (Date.now() - grantAt) > GRANT_MAX_MS) {
    sessionStorage.removeItem("secretGalleryGrant");
    sessionStorage.removeItem("secretGalleryGrantAt");
    window.location.replace("lock.html");
    throw new Error("Direct Secret Gallery URL blocked");
  }

  sessionStorage.removeItem("secretGalleryGrant");
  sessionStorage.removeItem("secretGalleryGrantAt");

  const status = document.getElementById("status");
  const gallery = document.getElementById("gallery");

  document.getElementById("lockBtn").addEventListener("click", () => {
    window.location.replace("lock.html");
  });

  function safeUrl(value) {
    try {
      const u = new URL(String(value));
      return (u.protocol === "https:" || u.protocol === "http:") ? u.href : "";
    } catch { return ""; }
  }

  async function loadGallery() {
    try {
      const snapshot = await getDocs(collection(db, "secretGallery"));
      const items = snapshot.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(item => safeUrl(item.url));

      gallery.innerHTML = "";
      if (!items.length) {
        status.style.display = "block";
        status.textContent = "अभी कोई private photo नहीं है।";
        return;
      }

      status.style.display = "none";
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = safeUrl(item.url);
        img.alt = item.title || "Private photo";
        img.loading = "lazy";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = item.title || "Private Photo";

        card.appendChild(img);
        card.appendChild(name);
        gallery.appendChild(card);
      });
    } catch (err) {
      console.error(err);
      status.style.display = "block";
      if (String(err?.code || "").includes("permission-denied")) {
        status.textContent = "Gallery permission बंद है। Firestore rules update करें।";
      } else {
        status.textContent = "Gallery load नहीं हुई। Page दुबारा खोलें।";
      }
    }
  }

  loadGallery();
</script>
</body>
</html>
