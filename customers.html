<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers | ROHILA E-MITRA CENTER</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:1300px;
margin:auto;
}

h1{
text-align:center;
color:#1565c0;
margin-bottom:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
text-align:center;
}

.box h2{
color:#1565c0;
margin-top:10px;
}

.form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.form input,
.form select{
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
}

.save{
background:#1565c0;
color:#fff;
border:none;
padding:12px;
cursor:pointer;
border-radius:6px;
}

.search{
margin:20px 0;
}

.search input{
width:100%;
padding:12px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#1565c0;
color:white;
}

.receipt{
background:green;
color:white;
border:none;
padding:8px 12px;
cursor:pointer;
}

.delete{
background:red;
color:white;
border:none;
padding:8px 12px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>👥 Customer Management</h1>

<div class="dashboard">

<div class="box">
<h3>Total Customers</h3>
<h2 id="totalCustomers">0</h2>
</div>

<div class="box">
<h3>Total Services</h3>
<h2 id="totalServices">0</h2>
</div>

<div class="box">
<h3>Total Collection</h3>
<h2 id="totalCollection">₹0</h2>
</div>

<div class="box">
<h3>Pending Amount</h3>
<h2 id="pendingAmount">₹0</h2>
</div>

</div>

<div class="form">

<input type="text" id="name" placeholder="Customer Name">

<input type="text" id="mobile" placeholder="Mobile Number">

<select id="service">
<option>Birth Certificate</option>
  <option>marriage certificate</option>
  <option>Death Certificate</option>
<option>PAN Card Correction</option>
<option>Aadhaar Address Correction</option>
<option>Jan Aadhaar</option>
<option>Ration Card</option>
<option>Passport</option>
<option>Police Verification</option>
<option>Income Certificate</option>
<option>Caste Certificate</option>
<option>Domicile Certificate</option>
  <option>Votar id </option>
  <option>Other Services </option>
<option>Ews Certificate</option>

</select>

<input type="number" id="total" placeholder="Total Amount">

<input type="number" id="paid" placeholder="Paid Amount">

<button class="save" id="saveBtn">
Save Customer
</button>
</div>

<div class="search">

<input type="text" id="search" placeholder="Search Customer...">

</div>

<table>

<thead>

<tr>

<th>Name</th>
<th>Mobile</th>
<th>Service</th>
<th>Total</th>
<th>Paid</th>
<th>Due</th>
<th>Date</th>
<th>Receipt</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="customerTable">

</tbody>

</table>

</div>


  <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Customer Diary</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #000;padding:8px;text-align:center}
input{width:100%;padding:5px}
button{padding:10px 20px;margin-top:10px}
</style>
</head>
<body>

<h2>👥 Customer Diary</h2>

<table id="tbl">
<tr>
<th>Date</th>
<th>Name</th>
<th>Mobile</th>
<th>Details</th>
<th>Total</th>
<th>Paid</th>
<th>Due</th>
</tr>

<tr>
<td><input type="date"></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
</tr>

</table>

<button onclick="addRow()">Add Row</button>

<script>
function addRow(){
const table=document.getElementById("tbl");
const row=table.insertRow(-1);

for(let i=0;i<7;i++){
const cell=row.insertCell(i);
cell.innerHTML='<input>';
}

row.cells[0].innerHTML='<input type="date">';
row.cells[4].innerHTML='<input type="number">';
row.cells[5].innerHTML='<input type="number">';
row.cells[6].innerHTML='<input type="number">';
}
</script>

</body>
</html>

<script type="module" src="customers.js"></script>

</body>
</html>
