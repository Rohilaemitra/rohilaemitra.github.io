<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers | ROHILA E-MITRA CENTER</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:1300px;
margin:auto;
}

h1{
text-align:center;
color:#1565c0;
margin-bottom:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
text-align:center;
}

.box h2{
color:#1565c0;
margin-top:10px;
}

.form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.form input,
.form select{
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
}

.save{
background:#1565c0;
color:#fff;
border:none;
padding:12px;
cursor:pointer;
border-radius:6px;
}

.search{
margin:20px 0;
}

.search input{
width:100%;
padding:12px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#1565c0;
color:white;
}

.receipt{
background:green;
color:white;
border:none;
padding:8px 12px;
cursor:pointer;
}

.delete{
background:red;
color:white;
border:none;
padding:8px 12px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>👥 Customer Management</h1>

<div class="dashboard">

<div class="box">
<h3>Total Customers</h3>
<h2 id="totalCustomers">0</h2>
</div>

<div class="box">
<h3>Total Services</h3>
<h2 id="totalServices">0</h2>
</div>

<div class="box">
<h3>Total Collection</h3>
<h2 id="totalCollection">₹0</h2>
</div>

<div class="box">
<h3>Pending Amount</h3>
<h2 id="pendingAmount">₹0</h2>
</div>

</div>

<div class="form">

<input type="text" id="name" placeholder="Customer Name">

<input type="text" id="mobile" placeholder="Mobile Number">

<select id="service">
<option>Birth Certificate</option>
<option>PAN Card Correction</option>
<option>Aadhaar Address Correction</option>
<option>Jan Aadhaar</option>
<option>Ration Card</option>
<option>Passport</option>
<option>Police Verification</option>
<option>Income Certificate</option>
<option>Caste Certificate</option>
<option>Domicile Certificate</option>
<option>Death Certificate</option>
<option>Ews Certificate</option>
<option>marriage certificate</option>
</select>

<input type="number" id="total" placeholder="Total Amount">

<input type="number" id="paid" placeholder="Paid Amount">

<button class="save" id="saveBtn">
Save Customer
</button>
</div>

<div class="search">

<input type="text" id="search" placeholder="Search Customer...">

</div>

<table>

<thead>

<tr>

<th>Name</th>
<th>Mobile</th>
<th>Service</th>
<th>Total</th>
<th>Paid</th>
<th>Due</th>
<th>Date</th>
<th>Receipt</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="customerTable">

</tbody>

</table>

</div>

<script type="module" src="customers.js"></script>

</body>
</html>
