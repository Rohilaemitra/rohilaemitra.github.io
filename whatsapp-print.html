<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Print | ROHILA E-MITRA</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.wrap{max-width:980px;margin:auto;padding:18px}
.top{background:linear-gradient(135deg,#0f766e,#16a34a);color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
.card{background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:16px}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #dbe2ea;font-size:15px}
button{cursor:pointer;font-weight:800;border:none}
.primary{background:#16a34a;color:#fff}.secondary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.preview{min-height:520px;display:flex;align-items:center;justify-content:center;background:#eef2f7;border:2px dashed #cbd5e1;border-radius:14px;overflow:auto}
.preview img{max-width:100%;max-height:500px;object-fit:contain}
.preview iframe{width:100%;height:520px;border:0;background:#fff}
.empty{color:#6b7280;text-align:center;padding:30px}
.meta{font-size:13px;color:#6b7280;margin-top:10px;word-break:break-all}
.note{margin-top:14px;padding:12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{min-height:360px}.preview iframe{height:360px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🖨️ WhatsApp Print</h1>
    <p>WhatsApp से आए PDF / Photo को चुनें, Preview देखें और Print करें।</p>
  </div>
  <div class="grid">
    <div class="card">
      <label>Document चुनें</label>
      <input id="fileInput" type="file" accept=".pdf,image/*">

      <div class="two">
        <div>
          <label>Paper Size</label>
          <select id="paper"><option>A4</option><option>A3</option><option>Letter</option></select>
        </div>
        <div>
          <label>Copies</label>
          <input id="copies" type="number" min="1" max="50" value="1">
        </div>
      </div>

      <label>Print Mode</label>
      <select id="mode"><option value="color">Color</option><option value="bw">Black & White</option></select>

      <label>Pages (PDF)</label>
      <input id="pages" type="text" placeholder="जैसे 1-3 या 1,3,5">

      <div class="btns">
        <button class="secondary" id="openBtn">Open</button>
        <button class="primary" id="printBtn">Print</button>
      </div>
      <button class="danger" id="clearBtn" style="margin-top:10px">Clear</button>

      <div class="note">PDF में page range, copies, paper size और color/B&W अंतिम Print dialog में भी चुना जा सकता है।</div>
    </div>

    <div class="card">
      <div class="preview" id="preview"><div class="empty">यहाँ Document Preview दिखाई देगा</div></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</div>

<script>
const fileInput=document.getElementById('fileInput');
const preview=document.getElementById('preview');
const meta=document.getElementById('meta');
const paper=document.getElementById('paper');
const mode=document.getElementById('mode');
const copies=document.getElementById('copies');
let currentFile=null, objectUrl=null, fileType=null;

function revoke(){if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}}
function empty(){preview.innerHTML='<div class="empty">यहाँ Document Preview दिखाई देगा</div>';meta.textContent='';}

fileInput.addEventListener('change',()=>{
  revoke();
  currentFile=fileInput.files[0];
  if(!currentFile){empty();return;}
  objectUrl=URL.createObjectURL(currentFile);
  meta.textContent=currentFile.name+' • '+(currentFile.size/1024).toFixed(1)+' KB';
  if(currentFile.type==='application/pdf'||currentFile.name.toLowerCase().endsWith('.pdf')){
    fileType='pdf'; preview.innerHTML='<iframe src="'+objectUrl+'"></iframe>';
  }else if(currentFile.type.startsWith('image/')){
    fileType='image'; preview.innerHTML='<img src="'+objectUrl+'" alt="Preview">';
  }else{
    fileType=null; preview.innerHTML='<div class="empty">PDF/JPG/PNG file चुनें।</div>';
  }
});

document.getElementById('openBtn').onclick=()=>{
  if(!objectUrl){alert('पहले document चुनें।');return;}
  window.open(objectUrl,'_blank');
};

document.getElementById('printBtn').onclick=()=>{
  if(!objectUrl){alert('पहले document चुनें।');return;}
  if(fileType==='pdf'){
    const w=window.open(objectUrl,'_blank');
    if(!w){alert('Popup blocked है।');return;}
    alert('PDF खुल गया है। अब Print में Pages, Copies, Paper Size और Color/B&W चुनें।');
    return;
  }
  if(fileType==='image'){
    const size=paper.value;
    const filter=mode.value==='bw'?'grayscale(100%)':'none';
    const count=Math.max(1,parseInt(copies.value||'1',10));
    const w=window.open('','_blank');
    if(!w){alert('Popup blocked है।');return;}
    let imgs='';
    for(let i=0;i<count;i++){imgs+='<div class="page"><img src="'+objectUrl+'"></div>';}
    w.document.write('<html><head><title>Print</title><style>@page{size:'+size+';margin:8mm}body{margin:0}.page{page-break-after:always;display:flex;align-items:center;justify-content:center;min-height:95vh}.page:last-child{page-break-after:auto}img{max-width:100%;max-height:95vh;object-fit:contain;filter:'+filter+'}</style></head><body>'+imgs+'<script>window.onload=function(){setTimeout(function(){window.print()},200)};<\/script></body></html>');
    w.document.close();
  }
};

document.getElementById('clearBtn').onclick=()=>{
  revoke(); currentFile=null; fileType=null; fileInput.value=''; empty();
};
window.addEventListener('beforeunload',revoke);
</script>
</body>
</html>
