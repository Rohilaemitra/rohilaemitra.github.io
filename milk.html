<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Milk Diary</title>

<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #000;padding:8px;text-align:center}
input{width:100%;padding:5px}
button{padding:10px 20px;margin-top:10px}
</style>

</head>

<body>

<h2>🥛 Milk Diary</h2>

<table id="milk">

<tr>
<th>Date</th>
<th>Name</th>
<th>Morning(L)</th>
<th>Evening(L)</th>
<th>Total(L)</th>
<th>Rate</th>
<th>Amount</th>
</tr>

<tr>
<td><input type="date"></td>
<td><input></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
</tr>

</table>

<button onclick="addMilk()">Add Row</button>

<script>
function addMilk(){

const table=document.getElementById("milk");

const row=table.insertRow(-1);

row.innerHTML=`
<td><input type="date"></td>
<td><input></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
`;

}
</script>

</body>
</html>
