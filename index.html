<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Gallery | ROHILA E-MITRA CENTER</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{
      --navy:#062b5c;
      --blue:#0b63ce;
      --bg:#f4f7fb;
      --white:#fff;
      --text:#172033;
      --muted:#667085;
      --line:#dfe7f0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,"Noto Sans Devanagari",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    header{
      background:linear-gradient(135deg,var(--navy),var(--blue));
      color:#fff;
      padding:22px 16px;
      box-shadow:0 6px 20px rgba(0,0,0,.12);
    }
    .wrap{width:min(1100px,calc(100% - 24px));margin:auto}
    .head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }
    h1{margin:0;font-size:clamp(24px,4vw,34px)}
    .sub{margin:5px 0 0;opacity:.9}
    .back{
      color:var(--navy);
      background:#fff;
      padding:10px 14px;
      border-radius:9px;
      font-weight:800;
      text-decoration:none;
    }
    main{padding:28px 0 50px}
    .panel{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:18px;
      box-shadow:0 10px 28px rgba(15,44,82,.08);
    }
    .status{
      text-align:center;
      color:var(--muted);
      padding:24px 10px;
      font-weight:700;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
    }
    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(15,44,82,.07);
    }
    .card a{display:block;text-decoration:none;color:inherit}
    .card img,.card video{
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;
      background:#e9eef5;
    }
    .name{
      padding:10px 12px;
      font-size:13px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .empty{
      text-align:center;
      padding:30px;
      color:#b42318;
      font-weight:800;
    }
    .note{
      margin-top:14px;
      font-size:13px;
      color:var(--muted);
      text-align:center;
    }
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.card img,.card video{height:260px}}
  </style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <h1>🔒 Secret Gallery</h1>
      <p class="sub">ROHILA E-MITRA CENTER</p>
    </div>
    <a class="back" href="../index.html">← Home</a>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="panel">
      <div id="status" class="status">Gallery loading...</div>
      <div id="gallery" class="grid"></div>
      <div class="note">यह page secret folder में मौजूद image/video files को अपने-आप दिखाता है।</div>
    </section>
  </div>
</main>

<script>
const owner = "Rohilaemitra";
const repo = "rohilaemitra.github.io";
const folder = "secret";
const api = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}?ref=main`;

const imageExt = /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i;
const videoExt = /\.(mp4|webm|mov|m4v)$/i;

async function loadGallery(){
  const status = document.getElementById("status");
  const gallery = document.getElementById("gallery");

  try{
    const res = await fetch(api, {headers: {"Accept":"application/vnd.github+json"}});
    if(!res.ok) throw new Error("GitHub API error " + res.status);

    const files = await res.json();
    const media = files.filter(f => f.type === "file" && (imageExt.test(f.name) || videoExt.test(f.name)));

    status.style.display = "none";

    if(!media.length){
      gallery.innerHTML = '<div class="empty">secret folder में कोई image/video file नहीं मिली।</div>';
      return;
    }

    media.forEach(file => {
      const card = document.createElement("div");
      card.className = "card";

      const link = document.createElement("a");
      link.href = file.download_url;
      link.target = "_blank";
      link.rel = "noopener";

      let mediaEl;
      if(imageExt.test(file.name)){
        mediaEl = document.createElement("img");
        mediaEl.src = file.download_url;
        mediaEl.alt = file.name;
        mediaEl.loading = "lazy";
      }else{
        mediaEl = document.createElement("video");
        mediaEl.src = file.download_url;
        mediaEl.controls = true;
        mediaEl.preload = "metadata";
        link.removeAttribute("href");
      }

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = file.name;

      link.appendChild(mediaEl);
      link.appendChild(name);
      card.appendChild(link);
      gallery.appendChild(card);
    });
  }catch(err){
    status.innerHTML = "Gallery load नहीं हुई। GitHub Pages deploy होने के बाद page refresh करें।";
    console.error(err);
  }
}

loadGallery();
</script>
</body>
</html>
