<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID Print - Rohila E-Mitra</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#111827}
  .wrap{max-width:1100px;margin:auto;padding:16px}
  .head{background:linear-gradient(135deg,#0f766e,#16a34a);color:#fff;padding:20px;border-radius:16px;margin-bottom:14px}
  .head h1{margin:0 0 6px;font-size:28px}
  .head p{margin:0}
  .grid{display:grid;grid-template-columns:350px 1fr;gap:14px}
  .card{background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
  label{display:block;font-weight:700;margin:10px 0 6px}
  input,select,button{width:100%;padding:11px;border:1px solid #dbe2ea;border-radius:10px;font-size:15px}
  button{border:0;font-weight:800;cursor:pointer}
  .blue{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#eef2f7}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .range{display:grid;grid-template-columns:80px 1fr 45px;gap:8px;align-items:center;margin:8px 0}
  .range input{padding:0}
  .small{font-size:12px;color:#667085}
  .previewBox{background:#e9eef5;border-radius:14px;padding:10px;overflow:auto;min-height:620px}
  .sheet{width:210mm;height:297mm;background:#fff;margin:0 auto;position:relative;box-shadow:0 3px 14px rgba(0,0,0,.18)}
  .cards{position:absolute;top:25mm;left:15mm;right:15mm;display:flex;gap:10mm;flex-wrap:wrap}
  .idcard{width:85.6mm;height:53.98mm;border:1px solid #bbb;overflow:hidden;position:relative;background:#fafafa}
  .idcard img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center center}
  .empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#94a3b8;font-weight:700;padding:15px}
  .tag{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.55);color:white;padding:3px 6px;border-radius:4px;font-size:11px}
  .mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .mode button.active{outline:3px solid #86efac}
  @media(max-width:820px){
    .grid{grid-template-columns:1fr}
    .previewBox{min-height:420px}
    .sheet{transform:scale(.55);transform-origin:top center;margin-bottom:-130mm}
  }
  @media(max-width:480px){
    .sheet{transform:scale(.42);margin-bottom:-173mm}
    .row{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff}
    .head,.controls,.small{display:none!important}
    .wrap,.card,.previewBox{margin:0;padding:0;border:0;box-shadow:none;background:#fff;max-width:none}
    .grid{display:block}
    .sheet{width:210mm;height:297mm;margin:0;box-shadow:none;transform:none!important}
    .tag{display:none}
    @page{size:A4 portrait;margin:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🪪 ID Print</h1>
    <p>Front + Back फोटो लगाएँ, size/position ठीक करें और A4 पर print करें।</p>
  </div>

  <div class="grid">
    <div class="card controls">
      <label>Front Photo</label>
      <input id="frontFile" type="file" accept="image/*">

      <label>Back Photo</label>
      <input id="backFile" type="file" accept="image/*">

      <div class="row">
        <div>
          <label>Card Width (mm)</label>
          <input id="cardW" type="number" value="85.6" step="0.1">
        </div>
        <div>
          <label>Card Height (mm)</label>
          <input id="cardH" type="number" value="53.98" step="0.1">
        </div>
      </div>

      <label>किस side को adjust करना है?</label>
      <select id="side">
        <option value="front">Front</option>
        <option value="back">Back</option>
      </select>

      <div class="range"><span>Zoom</span><input id="zoom" type="range" min="80" max="220" value="100"><b id="zoomV">100%</b></div>
      <div class="range"><span>Rotate</span><input id="rot" type="range" min="-180" max="180" value="0"><b id="rotV">0°</b></div>
      <div class="range"><span>Left/Right</span><input id="x" type="range" min="-40" max="40" value="0"><b id="xV">0</b></div>
      <div class="range"><span>Up/Down</span><input id="y" type="range" min="-40" max="40" value="0"><b id="yV">0</b></div>

      <label>Layout</label>
      <select id="layout">
        <option value="both">Front + Back</option>
        <option value="front">Front only</option>
        <option value="back">Back only</option>
        <option value="twofront">2 × Front</option>
        <option value="twoback">2 × Back</option>
      </select>

      <label>Print Mode</label>
      <div class="mode">
        <button id="colorBtn" class="green active" type="button">Color</button>
        <button id="bwBtn" class="gray" type="button">B&W</button>
      </div>

      <div class="tools">
        <button id="fitBtn" class="blue" type="button">Auto Fit</button>
        <button id="swapBtn" class="gray" type="button">Swap</button>
        <button id="printBtn" class="green" type="button">Print A4</button>
        <button id="clearBtn" class="red" type="button">Clear</button>
      </div>

      <p class="small">Tip: Print dialog में Scale = 100% / Actual Size रखें।</p>
    </div>

    <div class="card">
      <div class="previewBox">
        <div class="sheet">
          <div id="cards" class="cards"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const S={
  front:{url:"",z:100,r:0,x:0,y:0},
  back:{url:"",z:100,r:0,x:0,y:0},
  bw:false
};
const q=id=>document.getElementById(id);
const controls=["zoom","rot","x","y"];

function loadFile(side,file){
  if(S[side].url) URL.revokeObjectURL(S[side].url);
  S[side]={url:file?URL.createObjectURL(file):"",z:100,r:0,x:0,y:0};
  sync(); render();
}
q("frontFile").onchange=e=>loadFile("front",e.target.files[0]);
q("backFile").onchange=e=>loadFile("back",e.target.files[0]);

function current(){return S[q("side").value]}
function sync(){
  const s=current();
  q("zoom").value=s.z; q("rot").value=s.r; q("x").value=s.x; q("y").value=s.y;
  q("zoomV").textContent=s.z+"%"; q("rotV").textContent=s.r+"°";
  q("xV").textContent=s.x; q("yV").textContent=s.y;
}
q("side").onchange=sync;

controls.forEach(id=>{
  q(id).oninput=()=>{
    const s=current();
    s.z=+q("zoom").value; s.r=+q("rot").value; s.x=+q("x").value; s.y=+q("y").value;
    sync(); render();
  };
});

function card(side,label){
  const s=S[side], w=+q("cardW").value||85.6, h=+q("cardH").value||53.98;
  if(!s.url){
    return '<div class="idcard" style="width:'+w+'mm;height:'+h+'mm"><div class="empty">'+label+' photo चुनें</div></div>';
  }
  const filter=S.bw?'grayscale(100%)':'none';
  const tr='translate('+s.x+'%,'+s.y+'%) scale('+(s.z/100)+') rotate('+s.r+'deg)';
  return '<div class="idcard" style="width:'+w+'mm;height:'+h+'mm"><img src="'+s.url+'" style="transform:'+tr+';filter:'+filter+'"><span class="tag">'+label+'</span></div>';
}

function render(){
  const m=q("layout").value;
  let h="";
  if(m==="both") h=card("front","Front")+card("back","Back");
  if(m==="front") h=card("front","Front");
  if(m==="back") h=card("back","Back");
  if(m==="twofront") h=card("front","Front")+card("front","Front");
  if(m==="twoback") h=card("back","Back")+card("back","Back");
  q("cards").innerHTML=h;
}
q("layout").onchange=render;
q("cardW").oninput=render;
q("cardH").oninput=render;

q("fitBtn").onclick=()=>{
  ["front","back"].forEach(k=>{S[k].z=100;S[k].r=0;S[k].x=0;S[k].y=0});
  sync();render();
};
q("swapBtn").onclick=()=>{
  const t=S.front;S.front=S.back;S.back=t;render();sync();
};
q("colorBtn").onclick=()=>{
  S.bw=false;q("colorBtn").classList.add("active");q("bwBtn").classList.remove("active");render();
};
q("bwBtn").onclick=()=>{
  S.bw=true;q("bwBtn").classList.add("active");q("colorBtn").classList.remove("active");render();
};
q("printBtn").onclick=()=>window.print();
q("clearBtn").onclick=()=>{
  ["front","back"].forEach(k=>{if(S[k].url)URL.revokeObjectURL(S[k].url);S[k]={url:"",z:100,r:0,x:0,y:0}});
  q("frontFile").value="";q("backFile").value="";
  q("layout").value="both";q("side").value="front";S.bw=false;
  q("colorBtn").classList.add("active");q("bwBtn").classList.remove("active");
  sync();render();
};
window.onbeforeunload=()=>["front","back"].forEach(k=>{if(S[k].url)URL.revokeObjectURL(S[k].url)});
sync();render();
</script>
</body>
</html>
