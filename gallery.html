<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | ROHILA E-MITRA CENTER</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-page{width:min(1150px,94%);margin:25px auto}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    .gallery-item{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.12)}
    .gallery-item img{width:100%;height:250px;object-fit:cover;display:block}
    .gallery-meta{padding:12px}
    .panel{background:#fff;padding:18px;border-radius:12px;margin-bottom:20px}
    .hidden{display:none!important}
  </style>
</head>
<body>
<header><div class="logo"><h1>ROHILA E-MITRA CENTER</h1><p>Photo Gallery</p></div>
<nav><a href="index.html">Home</a><a href="forms.html">Forms</a><a href="login.html">Admin</a></nav></header>
<main class="gallery-page">
  <div id="status"></div>
  <section id="uploadPanel" class="panel hidden">
    <h2>नई फोटो Upload</h2>
    <form id="uploadForm">
      <input id="title" placeholder="Photo title" required>
      <input id="file" type="file" accept="image/*" required>
      <button class="btn" type="submit">Upload</button>
    </form>
  </section>
  <h1>Photo Gallery</h1>
  <section id="galleryGrid" class="gallery-grid"></section>
</main>
<script type="module" src="gallery.js"></script>
</body>
</html>
