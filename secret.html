<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Secret Gallery | ROHILA E-MITRA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="admin.html">🔒 Secret Gallery</a>
    <nav class="nav">
      <a href="admin.html">Dashboard</a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>
<main class="container">
  <div id="status" class="status show info">Admin verification...</div>
  <section class="panel">
    <h2>Private Photo Upload</h2>
    <p class="muted">यह पेज Admin login के बाद ही खुलेगा।</p>
    <form id="uploadForm" class="form-grid">
      <div class="field span-2">
        <label>Photo Title</label>
        <input id="title" maxlength="100" placeholder="Photo title" required>
      </div>
      <div class="field span-2">
        <label>Select Image</label>
        <input id="file" type="file" accept="image/*" required>
      </div>
      <div class="span-4">
        <button class="btn" type="submit">🔒 Upload Private Photo</button>
      </div>
    </form>
  </section>
  <h1>Private Photos</h1>
  <section id="secretGrid" class="gallery-grid"></section>
</main>
<script type="module" src="secret.js"></script>
</body>
</html>
