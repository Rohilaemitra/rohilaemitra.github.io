<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milk Diary</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html">🥛 Milk Diary</a><nav class="nav"><a href="admin.html">Dashboard</a><a href="customer-diary.html">Customer Diary</a></nav></div></header><main class="container"><div id="status" class="status"></div><section class="grid"><div class="card"><div class="muted">Entries</div><div id="count" class="metric">0</div></div><div class="card"><div class="muted">Milk</div><div id="milkSum" class="metric">0 L</div></div><div class="card"><div class="muted">Amount</div><div id="amountSum" class="metric">₹0</div></div><div class="card"><div class="muted">Due</div><div id="dueSum" class="metric">₹0</div></div></section><section class="panel"><h2>Add / Edit Milk Entry</h2><form id="entryForm" class="form-grid"><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Customer Name</label><input id="customerName" required></div><div class="field"><label>Mobile</label><input id="mobile" maxlength="10" inputmode="numeric"></div><div class="field"><label>Shift</label><select id="shift"><option>Morning</option><option>Evening</option></select></div><div class="field"><label>Milk Type</label><select id="milkType"><option>Cow</option><option>Buffalo</option><option>Mixed</option></select></div><div class="field"><label>Quantity (L)</label><input id="quantity" type="number" min="0" step="0.01" required></div><div class="field"><label>Rate</label><input id="rate" type="number" min="0" step="0.01" required></div><div class="field"><label>Total</label><input id="total" type="number" readonly></div><div class="field"><label>Paid</label><input id="paid" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Due</label><input id="due" type="number" readonly></div><div class="span-4 actions"><button class="btn" type="submit" id="saveBtn">Save</button><button class="btn light" type="button" id="clearBtn">Clear</button></div></form></section><section class="panel"><div class="toolbar"><input id="search" placeholder="ग्राहक या मोबाइल खोजें"><input id="monthFilter" type="month"><button id="allBtn" class="btn light">Show All</button><button id="printBtn" class="btn secondary">Print</button><button id="csvBtn" class="btn success">CSV Export</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Customer</th><th>Mobile</th><th>Shift</th><th>Type</th><th>Qty</th><th>Rate</th><th>Total</th><th>Paid</th><th>Due</th><th class="no-print">Action</th></tr></thead><tbody id="tbody"><tr><td class="empty" colspan="11">Loading...</td></tr></tbody></table></div></section></main><script type="module" src="milk-diary.js"></script></body></html>
