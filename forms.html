<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Government Forms | ROHILA E-MITRA CENTER</title>
  <meta name="description" content="ROHILA E-MITRA CENTER के सभी सरकारी PDF फॉर्म डाउनलोड करें।">
  <link rel="stylesheet" href="style.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}
    .topbar{background:#0d47a1;color:#fff;padding:18px 4%;display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .topbar h1{font-size:22px;margin:0}.topbar p{margin:5px 0 0}
    .topbar a{color:#fff;text-decoration:none;background:#1565c0;padding:10px 16px;border-radius:8px;font-weight:700}
    main{width:min(1180px,94%);margin:25px auto 45px}
    .head-card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
    .search{width:100%;padding:14px;border:1px solid #b7c1d1;border-radius:9px;font-size:16px;margin-top:14px}
    .status{margin:14px 0;padding:12px;border-radius:8px;background:#e3f2fd;color:#0d47a1;font-weight:700}
    .status.error{background:#ffebee;color:#b71c1c}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px;margin-top:18px}
    .form-card{background:#fff;padding:18px;border-radius:13px;box-shadow:0 4px 15px rgba(0,0,0,.09);display:flex;flex-direction:column;justify-content:space-between;min-height:150px}
    .form-card h3{font-size:17px;line-height:1.45;margin:0 0 14px;word-break:break-word}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    .btn{display:inline-block;text-decoration:none;padding:10px 14px;border-radius:8px;font-weight:700;border:0;cursor:pointer}
    .view{background:#1565c0;color:#fff}.download{background:#2e7d32;color:#fff}
    .empty{background:#fff;padding:30px;text-align:center;border-radius:12px;grid-column:1/-1}
    footer{text-align:center;background:#102a43;color:#fff;padding:22px}
  </style>
</head>
<body>
  <header class="topbar">
    <div><h1>ROHILA E-MITRA CENTER</h1><p>सभी सरकारी फॉर्म डाउनलोड</p></div>
    <nav><a href="index.html">🏠 Home</a></nav>
  </header>

  <main>
    <section class="head-card">
      <h2>📄 Forms Folder के सभी फॉर्म</h2>
      <p>यह पेज GitHub के <b>forms</b> folder की सभी PDF/Word files अपने-आप दिखाता है।</p>
      <input id="searchForm" class="search" type="search" placeholder="फॉर्म का नाम खोजें...">
      <div id="status" class="status">Forms loading...</div>
    </section>
    <section id="formsList" class="grid"></section>
  </main>

  <footer>© 2026 ROHILA E-MITRA CENTER | Sikar, Rajasthan</footer>
  <script src="forms.js"></script>
</body>
</html>
