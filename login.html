<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet" href="style.css">

<style>

body{

display:flex;

justify-content:center;

align-items:center;

height:100vh;

background:#1565c0;

}

.login-box{

background:#fff;

padding:40px;

border-radius:12px;

box-shadow:0 5px 20px rgba(0,0,0,.2);

width:380px;

text-align:center;

}

.login-box h2{

margin-bottom:20px;

color:#1565c0;

}

.login-box input{

width:100%;

padding:12px;

margin:10px 0;

border:1px solid #ccc;

border-radius:6px;

font-size:16px;

}

.login-box button{

width:100%;

padding:12px;

background:#1565c0;

color:#fff;

border:none;

border-radius:6px;

font-size:18px;

cursor:pointer;

}

.login-box button:hover{

background:#0d47a1;

}

#error{

color:red;

margin-top:10px;

}

</style>

</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

<p id="error"></p>

</div>

<script type="module" src="login.js"></script>

</body>

</html>
