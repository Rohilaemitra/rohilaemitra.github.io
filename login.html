<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="style.css"></head><body><main class="login-shell"><section class="login-card"><h1>🔐 Admin Login</h1><p class="muted">Firebase Authentication में बने admin email से login करें।</p><div id="status" class="status"></div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" style="width:100%;margin-top:18px" type="submit">Login</button></form><p style="text-align:center"><a href="index.html">← वेबसाइट पर वापस</a></p></section></main><script type="module" src="login.js"></script></body></html>
