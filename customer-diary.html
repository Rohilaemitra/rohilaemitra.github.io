<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Diary</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html">Customer Diary</a><nav class="nav"><a href="admin.html">Dashboard</a><a href="milk-diary.html">Milk Diary</a></nav></div></header><main class="container"><div id="status" class="status"></div><section class="grid"><div class="card"><div class="muted">Records</div><div id="count" class="metric">0</div></div><div class="card"><div class="muted">Total</div><div id="totalSum" class="metric">₹0</div></div><div class="card"><div class="muted">Paid</div><div id="paidSum" class="metric">₹0</div></div><div class="card"><div class="muted">Due</div><div id="dueSum" class="metric">₹0</div></div></section><section class="panel"><h2>Add / Edit Customer Work</h2><form id="entryForm" class="form-grid"><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Mobile</label><input id="mobile" inputmode="numeric" maxlength="10"></div><div class="field"><label>Service</label><input id="service" required placeholder="PAN Card / Certificate"></div><div class="field"><label>Total Amount</label><input id="total" type="number" min="0" step="0.01" required></div><div class="field"><label>Paid</label><input id="paid" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Due</label><input id="due" type="number" readonly></div><div class="field"><label>Status</label><select id="workStatus"><option>Pending</option><option>In Progress</option><option>Completed</option></select></div><div class="field span-4"><label>Note</label><textarea id="note" rows="2"></textarea></div><div class="span-4 actions"><button class="btn" type="submit" id="saveBtn">Save</button><button class="btn light" type="button" id="clearBtn">Clear</button></div></form></section><section class="panel"><div class="toolbar"><input id="search" placeholder="नाम, मोबाइल, सेवा खोजें"><select id="filterStatus"><option value="">All Status</option><option>Pending</option><option>In Progress</option><option>Completed</option></select><button class="btn secondary" id="printBtn">Print</button><button class="btn success" id="csvBtn">CSV Export</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Name</th><th>Mobile</th><th>Service</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th><th class="no-print">Action</th></tr></thead><tbody id="tbody"><tr><td class="empty" colspan="9">Loading...</td></tr></tbody></table></div></section></main><script type="module" src="customer-diary.js"></script></body></html>
