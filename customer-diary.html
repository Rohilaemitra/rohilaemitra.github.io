<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Customer Diary</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
padding:20px;
max-width:1400px;
margin:auto;
}

.title{
text-align:center;
font-size:30px;
margin-bottom:20px;
color:#1565c0;
}

.form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.form input{
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

.saveBtn{
background:#1565c0;
color:#fff;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
font-size:17px;
}

.saveBtn:hover{
background:#0d47a1;
}

.search{
margin-top:20px;
width:100%;
padding:12px;
font-size:16px;
border-radius:8px;
border:1px solid #bbb;
}

.tableBox{
overflow:auto;
margin-top:20px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th{
background:#1565c0;
color:#fff;
padding:12px;
}

td{
padding:10px;
text-align:center;
border:1px solid #ddd;
}

.edit{
background:#4CAF50;
color:#fff;
padding:6px 12px;
border:none;
border-radius:5px;
cursor:pointer;
}

.delete{
background:red;
color:#fff;
padding:6px 12px;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="title">

👥 Customer Diary

</div>
  <div class="summary">

<div class="card">
<h3>Total Customers</h3>
<h2 id="totalCustomers">0</h2>
</div>

<div class="card">
<h3>Total Collection</h3>
<h2 id="totalCollection">₹0</h2>
</div>

<div class="card">
<h3>Total Paid</h3>
<h2 id="totalPaid">₹0</h2>
</div>

<div class="card">
<h3>Total Due</h3>
<h2 id="totalDue">₹0</h2>
</div>

</div>

<div style="margin:15px 0;">
<button class="saveBtn" onclick="printDiary()">
🖨 Print Diary
</button>
</div>

<div class="form">

<input type="date" id="date">

<input type="text" id="name" placeholder="Customer Name">

<input type="text" id="mobile" placeholder="Mobile">

<input type="text" id="details" placeholder="Details">

<input type="number" id="total" placeholder="Total Amount">

<input type="number" id="paid" placeholder="Paid Amount">

<input type="number" id="due" placeholder="Due Amount" readonly>

<button class="saveBtn" id="saveBtn">

💾 Save Customer

</button>

</div>

<input
class="search"
id="search"
placeholder="🔍 Search Customer..."
>

<div class="tableBox">

<table id="customerTable">

<thead>

<tr>

<th>Date</th>

<th>Name</th>

<th>Mobile</th>

<th>Details</th>

<th>Total</th>

<th>Paid</th>

<th>Due</th>

<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

<script type="module" src="customer-diary.js"></script>

</body>
</html>
