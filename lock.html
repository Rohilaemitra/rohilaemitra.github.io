<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔒 Secret Folder</title>

<style>
body{
font-family:Arial;
background:#111;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#222;
padding:30px;
border-radius:15px;
text-align:center;
width:320px;
}

input{
width:100%;
padding:10px;
margin:15px 0;
font-size:18px;
}

button{
background:#0a7d32;
color:white;
padding:10px 25px;
border:none;
cursor:pointer;
border-radius:8px;
font-size:18px;
}
</style>

</head>

<body>

<div class="box">

<h2>🔒 Secret Folder</h2>

<input type="password" id="pass" placeholder="Enter Password">

<button onclick="login()">Open</button>

</div>

<script>

function login(){

if(document.getElementById("pass").value=="12345"){

location.href="gallery.html";

}else{

alert("Wrong Password");

}

}

</script>

</body>
</html>
