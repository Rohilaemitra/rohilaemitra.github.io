<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt Generator</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html">Receipt Generator</a><nav class="nav"><a href="admin.html">Dashboard</a></nav></div></header><main class="container"><section class="panel no-print"><h2>Receipt Details</h2><form id="receiptForm" class="form-grid"><div class="field"><label>Receipt No.</label><input id="receiptNo" required></div><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Customer Name</label><input id="name" required></div><div class="field"><label>Mobile</label><input id="mobile"></div><div class="field span-2"><label>Service</label><input id="service" required></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Payment Mode</label><select id="mode"><option>Cash</option><option>UPI</option><option>Bank</option></select></div><div class="field span-4"><label>Note</label><input id="note"></div><div class="span-4 actions"><button class="btn" type="submit">Generate</button><button class="btn secondary" type="button" id="printBtn">Print / Save PDF</button></div></form></section><section id="receipt" class="receipt"><div class="receipt-head"><h1>ROHILA E-MITRA CENTER</h1><div>Digital Government Services</div></div><div class="receipt-row"><b>Receipt No.</b><span id="rNo">-</span></div><div class="receipt-row"><b>Date</b><span id="rDate">-</span></div><div class="receipt-row"><b>Customer</b><span id="rName">-</span></div><div class="receipt-row"><b>Mobile</b><span id="rMobile">-</span></div><div class="receipt-row"><b>Service</b><span id="rService">-</span></div><div class="receipt-row"><b>Amount</b><span id="rAmount">₹0.00</span></div><div class="receipt-row"><b>Payment Mode</b><span id="rMode">-</span></div><div class="receipt-row"><b>Note</b><span id="rNote">-</span></div><p class="right"><b>Authorized Signature</b></p><p style="text-align:center" class="muted">Thank you</p></section></main><script type="module" src="receipt.js"></script></body></html>
