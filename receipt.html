<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receipt Generator</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#1565c0;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#1565c0;
color:#fff;
border:none;
font-size:18px;
cursor:pointer;
border-radius:6px;
}

.receipt{
margin-top:20px;
padding:20px;
border:2px dashed #1565c0;
}

</style>

</head>

<body>

<div class="container">

<h1>🧾 Receipt Generator</h1>

<input type="text" id="name" placeholder="Customer Name">

<input type="text" id="mobile" placeholder="Mobile Number">

<select id="service">

<option>PAN Card</option>
<option>Aadhaar</option>
<option>Jan Aadhaar</option>
<option>Passport</option>
<option>Ayushman Card</option>
<option>Income Certificate</option>
<option>Caste Certificate</option>
<option>Domicile Certificate</option>

</select>

<input type="number" id="total" placeholder="Total Amount">

<input type="number" id="paid" placeholder="Paid Amount">

<button onclick="generateReceipt()">

Generate Receipt

</button>

<div id="receipt" class="receipt"></div>

</div>

<script src="receipt.js"></script>

</body>
</html>
